name: Sushi dart-define env
description: Validate Sushi CI secrets and write JSON for flutter --dart-define-from-file
runs:
  using: composite
  steps:
    - name: Validate required environment
      shell: bash
      run: |
        missing=()
        for var in TELEGRAM_API_ID TELEGRAM_API_HASH; do
          [ -z "${!var:-}" ] && missing+=("$var")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing required secrets/variables: ${missing[*]}"
          echo "Set TELEGRAM_API_ID/HASH in Infisical sushi project /client-ci (or GitHub Actions secrets)."
          exit 1
        fi

    - name: Generate dart-defines file and bundled default.env
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path

        def env_first(*names: str) -> str:
            for name in names:
                value = (os.environ.get(name) or "").strip()
                if value:
                    return value
            return ""

        # Never fall back to legacy BOT_USERNAME / OXPLAYER_* — those still hold Oxplayer values in CI.
        main_bot = env_first("SUSHI_MAIN_BOT") or "sushiMovieBot"
        init_bot = env_first("SUSHI_INIT_BOT") or "sushiInit01Bot"
        main_bot = main_bot.lstrip("@")
        init_bot = init_bot.lstrip("@")

        keys = {
            "SUSHI_MAIN_BOT": main_bot,
            "SUSHI_INIT_BOT": init_bot,
            "SUSHI_API_BASE_URL": env_first("SUSHI_API_BASE_URL"),
            "SUSHI_API_BASE_IRAN": env_first("SUSHI_API_BASE_IRAN") or "https://api.sushi.ir",
            "TELEGRAM_API_ID": env_first("TELEGRAM_API_ID"),
            "TELEGRAM_API_HASH": env_first("TELEGRAM_API_HASH"),
        }

        sentry_env = env_first("SENTRY_ENVIRONMENT") or "production"
        keys["SENTRY_ENVIRONMENT"] = sentry_env

        webapp_short = env_first("TELEGRAM_WEBAPP_SHORT_NAME")
        if webapp_short:
            keys["TELEGRAM_WEBAPP_SHORT_NAME"] = webapp_short
        hosted_webapp = env_first("TELEGRAM_HOSTED_WEBAPP_HTTPS_URL")
        if hosted_webapp:
            keys["TELEGRAM_HOSTED_WEBAPP_HTTPS_URL"] = hosted_webapp
        webapp_bot = env_first("TELEGRAM_WEBAPP_BOT_USERNAME", "SUSHI_MAIN_BOT") or main_bot
        keys["TELEGRAM_WEBAPP_BOT_USERNAME"] = webapp_bot.lstrip("@")

        sentry_dsn = env_first("SENTRY_DSN")
        require_sentry = env_first("REQUIRE_SENTRY_DSN").lower() in ("1", "true", "yes")
        if sentry_dsn:
            keys["SENTRY_DSN"] = sentry_dsn
        elif require_sentry:
            print("Missing SENTRY_DSN — required for production client builds.")
            raise SystemExit(1)

        out = Path(os.environ["RUNNER_TEMP"]) / "flutter-build-env.json"
        # Drop empty optional keys so dart/env stay clean
        keys = {k: v for k, v in keys.items() if str(v).strip() != ""}
        out.write_text(json.dumps(keys), encoding="utf-8")

        env_path = Path("assets/env/default.env")
        env_path.parent.mkdir(parents=True, exist_ok=True)
        env_path.write_text(
            "\n".join(f"{k}={v}" for k, v in keys.items()) + "\n",
            encoding="utf-8",
        )
        print(f"Wrote {env_path} ({env_path.stat().st_size} bytes)")
        print(
            "SUSHI_MAIN_BOT=",
            keys.get("SUSHI_MAIN_BOT"),
            " SUSHI_INIT_BOT=",
            keys.get("SUSHI_INIT_BOT"),
            " TELEGRAM_API_ID set=",
            bool(keys.get("TELEGRAM_API_ID")),
            sep="",
        )
        PY
        echo "FLUTTER_BUILD_ENV_FILE=$RUNNER_TEMP/flutter-build-env.json" >> "$GITHUB_ENV"
