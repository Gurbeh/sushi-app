name: Bug report
description: Something is broken in the Sushi app
title: "BUG: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** If Fladder works against real Jellyfin but Sushi fails on the same flow, the bug is often in [Sushi-be](https://github.com/Aryan-mor/Sushi-be/issues/new/choose) (API shim), not Fladder client code.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - lib/Sushi (OX-specific)
        - Home / library / empty or wrong content
        - Playback / streaming
        - Seerr / requests
        - Login / session
        - Settings
        - Website
        - Crash / performance
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
      placeholder: Short and explicit description...
    validations:
      required: true

  - type: textarea
    id: reprod
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open Sushi on Android
        2. Sign in with Telegram
        3. Open Home
        4. See empty screen
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      placeholder: Drag and drop in a follow-up comment, or paste image URLs

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - Android TV
        - iOS
        - Linux
        - Windows
        - macOS
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Sushi build or version
      placeholder: e.g. 1.0.0+42

  - type: input
    id: server
    attributes:
      label: Sushi API / environment
      placeholder: e.g. prod API, dev stack, user role VIP/admin
    validations:
      required: true

  - type: checkboxes
    id: triage
    attributes:
      label: Triage hints (optional)
      options:
        - label: "Compared API response to Jellyfin docs or curl"
          required: false
        - label: "Likely Sushi-be — please move or link issue there"
          required: false
