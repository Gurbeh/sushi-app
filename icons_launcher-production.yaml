icons_launcher:
  image_path: "icons/production/sushi_icon.png"
  platforms:
    android:
      adaptive_foreground_image: "icons/production/sushi_adaptive_icon.png"
      adaptive_background_color: "#DED1C8"
      adaptive_monochrome_image: "icons/production/sushi_adaptive_icon.png"
      notification_image: icons/sushi_notification_icon.png
      enable: true
    ios:
      image_path: "icons/production/sushi_store_icon.png"
      enable: false
    windows:
      image_path: "icons/production/sushi_icon_desktop.png"
      enable: true
    macos:
      image_path: "icons/production/sushi_macos_icon.png"
      enable: true
    linux:
      image_path: "icons/production/sushi_icon_desktop.png"
      enable: true
    web:
      favicon_path: "icons/production/sushi_icon_desktop.png"
      enable: true
